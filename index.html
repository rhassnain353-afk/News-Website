function adm(){return`<div class=box><h3>Ad Manager (5 slots)</h3><small>1 Header · 2 Sidebar · 3 In-article · 4 Footer · 5 Sticky bottom</small>${ADS.map((a,i)=>{const c=a[3].split(',');return`<div style="border-top:1px solid var(--bd);margin-top:10px;padding-top:6px"><b>Slot ${i+1}</b><input class=ad_t value="${esc(a[0])}" placeholder="Ad title"><input class=ad_s value="${esc(a[1])}" placeholder="Subtitle"><input class=ad_b value="${esc(a[2])}" placeholder="Button text"><input class=ad_u value="${esc(a[4]||'')}" placeholder="Click link (https://...)"><label>Color 1 <input type=color class=ad_c1 value="${c[0]}"></label> <label>Color 2 <input type=color class=ad_c2 value="${c[1]}"></label></div>`}).join('')}<p><button onclick="saveAds()">Save Ads</button></p></div>
<div class=box><h3>Bulk Import (JSON)</h3><small>Paste: [{"title":"..","cat":"Sports","topic":"..","kw":"a,b","media":"","body":"&lt;p&gt;..&lt;/p&gt;"}]</small><textarea id=bj rows=6 style="width:100%;margin:6px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px"></textarea><button onclick="bulk()">Import Articles</button></div>`}
async function saveAds(){const g=c=>[...document.querySelectorAll('.'+c)].map(x=>x.value);const t=g('ad_t'),s=g('ad_s'),b=g('ad_b'),u=g('ad_u'),c1=g('ad_c1'),c2=g('ad_c2');ADS=t.map((x,i)=>[x,s[i],b[i],c1[i]+','+c2[i],u[i].trim()]);try{F?await F.fs.setDoc(F.fs.doc(F.db,'config','ads'),{json:JSON.stringify(ADS)}):localStorage.dp_ads=JSON.stringify(ADS);renderAds();alert('Ads saved!')}catch(e){alert('Error: '+e.message)}}
async function bulk(){try{const l=JSON.parse(bj.value);let n=0;for(const x of l){await put({id:Date.now().toString(36)+(n++),author:x.author||'Raza Khabar Desk',title:x.title,cat:x.cat,topic:x.topic||'',kw:x.kw||'',media:x.media||'',body:x.body,feat:!!x.feat,ts:Date.now()-n*36e5})}alert(n+' articles imported');route()}catch(e){alert('Error: '+e.message)}}
function tb(c,a){if(c=='createLink')a=prompt('URL?');if(c=='createLink'&&!a)return;document.execCommand(c,false,a||null)}
async function tg(id){const a=A.find(x=>x.id==id);try{await put({...a,feat:!a.feat});route()}catch(e){alert(e.message)}}
async function dl(id){if(confirm('Delete this article?')){try{await rm(id);route()}catch(e){alert(e.message)}}}
function route(){const h=location.hash.slice(2).split('/'),k=decodeURIComponent(h[1]||'');nav();document.title='Raza Khabar Times';$('#ld')&&$('#ld').remove();
 if(h[0]=='p')pg(h[1]);else if(h[0]=='a')art(h[1]);else if(h[0]=='cat')list(k,A.filter(a=>a.cat==k));else if(h[0]=='q')list('Search: '+k,A.filter(a=>[a.title,a.kw,a.cat,a.topic,a.author].join(' ').toLowerCase().includes(k.toLowerCase())));else if(h[0]=='admin')admin();else home();if(h[0]!='admin')scrollTo(0,0)}
$('#q').oninput=e=>{const v=e.target.value.trim();if(v.toLowerCase()==ADMIN_EMAIL){e.target.value='';location.hash='#/admin';return}location.hash=v?'#/q/'+encodeURIComponent(v):'#/'};
const setT=t=>{document.documentElement.dataset.t=t;localStorage.theme=t};setT(localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#th').onclick=()=>setT(document.documentElement.dataset.t=='dark'?'light':'dark');
renderAds();localStorage.removeItem('news');addEventListener('hashchange',route);init();
</script></body></html>
