<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Pulse News</title>
<meta name="theme-color" content="#d71920"><meta name="description" content="Daily Pulse - latest news from Pakistan and the world: International, Sports, Entertainment, Technology, Business and Politics.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d71920'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='900' text-anchor='middle' fill='white' font-family='Arial'%3EDP%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f4f6;--cd:#fff;--tx:#111;--mu:#6b7280;--ac:#d71920;--bd:#e5e7eb}
[data-t=dark]{--bg:#0e1014;--cd:#181b22;--tx:#eceef2;--mu:#98a0ad;--bd:#2a2f3a}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
a{color:inherit;text-decoration:none}img,video{max-width:100%}
.w{max-width:1200px;margin:auto;padding:0 14px}
header{background:var(--cd);border-bottom:3px solid var(--ac);position:sticky;top:0;z-index:50}
.bar{display:flex;gap:10px;align-items:center;padding:8px 14px;max-width:1200px;margin:auto}
.logo{font-size:24px;font-weight:900;letter-spacing:1px}.logo b{color:var(--ac)}
input,button,select{font:inherit}
#q{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--bg);color:var(--tx)}
button{cursor:pointer;border:0;border-radius:6px;padding:8px 14px;background:var(--ac);color:#fff}
#th{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1200px;margin:auto;padding:0 10px}
nav a{padding:10px 14px;white-space:nowrap;font-weight:600}nav a.on,nav a:hover{color:var(--ac);box-shadow:inset 0 -3px var(--ac)}
.ad{display:flex;margin:12px auto;max-width:100%;overflow:hidden;border-radius:8px;position:relative}.ad:after{content:'Ad';position:absolute;top:2px;left:4px;font-size:9px;background:#0007;color:#fff;padding:0 5px;border-radius:2px}
.adc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:100%;padding:8px 18px;color:#fff;font-weight:700;cursor:pointer}.adc small{opacity:.85;font-weight:400}.adc i{font-style:normal;background:#fff;color:#111;padding:5px 14px;border-radius:20px;font-size:13px;white-space:nowrap}.sq .adc{flex-direction:column;justify-content:center;text-align:center;font-size:20px;gap:12px}#st .adc{padding-right:50px}
.lb{width:728px;height:90px}.sq{width:300px;height:250px}.ia{height:100px;margin:20px 0}
#st{position:fixed;bottom:0;left:0;right:0;height:56px;margin:0;z-index:60;background:var(--cd)}#st button{position:absolute;right:6px;top:6px;padding:2px 8px;z-index:2}
.hero{position:relative;border-radius:10px;overflow:hidden;display:block;margin:14px 0}.hero img{width:100%;height:420px;object-fit:cover;display:block}
.hero div{position:absolute;inset:auto 0 0;padding:60px 20px 20px;background:linear-gradient(transparent,#000c);color:#fff}.hero h1{margin:6px 0;font-size:clamp(22px,4vw,38px);line-height:1.2}
.tag{display:inline-block;background:var(--ac);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase}
.wrap{display:grid;grid-template-columns:1fr 300px;gap:20px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;overflow:hidden;display:block}.card img{width:100%;height:150px;object-fit:cover;display:block}.card div{padding:10px 12px}.card h3{margin:6px 0;font-size:17px;line-height:1.3}.card small,small{color:var(--mu)}
h2.sec{border-left:5px solid var(--ac);padding-left:10px;margin:26px 0 12px}
.side{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:14px}.side a{display:block;padding:8px 0;border-bottom:1px solid var(--bd)}
.art{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:18px;margin:14px 0}.art h1{line-height:1.25}.art img,.art video{width:100%;border-radius:8px}.vid{position:relative;padding-top:56%}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.art p{font-size:18px}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:16px;margin:14px auto;max-width:900px}.box input:not([type=checkbox]),.box select{width:100%;padding:9px;margin:5px 0;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.ed{min-height:200px;border:1px solid var(--bd);border-radius:6px;padding:10px;background:var(--bg)}.tb button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:4px 10px;margin:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.err{color:var(--ac)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}td button{padding:3px 8px;margin:1px}
footer{text-align:center;color:var(--mu);padding:20px 10px}
@media(max-width:900px){.lb .adc small,#st .adc small{display:none}.adc{font-size:14px}.sq .adc{flex-direction:row;font-size:15px}.wrap{grid-template-columns:1fr}.lb{width:100%;height:60px}.hero img{height:260px}.sq{width:100%;height:120px}.logo{font-size:19px}}
</style></head><body>
<header><div class="ad lb" data-ad="0"></div>
<div class="bar"><a class="logo" href="#/">DAILY<b>PULSE</b></a><input id="q" placeholder="Search title, keyword, category..."><button id="th" title="Theme">🌓</button></div>
<nav id="nav"></nav></header>
<main class="w" id="app"></main>
<footer><div class="ad lb" data-ad="3"></div>© 2026 Daily Pulse News. All rights reserved.</footer>
<div class="ad" id="st"><div data-ad="4" style="width:100%;height:100%"></div><button onclick="this.parentNode.remove()">✕</button></div>
<script>
// ====== PASTE YOUR FIREBASE CONFIG HERE (Project settings > Web app). Leave null for Demo mode (localStorage) ======
const FBC={apiKey:"AIzaSyCdoPmjdYf1m0P03wqAMQKD6DiBHBUufdM",authDomain:"daily-pulse-news.firebaseapp.com",projectId:"daily-pulse-news",storageBucket:"daily-pulse-news.firebasestorage.app",messagingSenderId:"580526124826",appId:"1:580526124826:web:37edc9b9e128b390a6c6a3"};
const ADMIN_EMAIL='rhassnain353@gmail.com';
const CATS=['International','Sports','Entertainment','Technology','Business','Politics'];
const ADS=[['🚀 Learn Python & AI — Start Free Today','Free online coding courses for beginners','Join Now','#d71920,#7a0f2e'],['📱 Mega Mobile Sale — Up to 30% Off','Latest smartphones & accessories','Shop Now','#0f766e,#134e4a'],['☁️ Fast & Secure Web Hosting','Launch your website in minutes','Get Started','#4338ca,#1e1b4b'],['🎓 Admissions Open — Online Degrees','Study from home, learn at your pace','Apply Now','#c2410c,#7c2d12'],['⚡ Free Delivery on All Orders','Shop online & save more','Order Now','#a21caf,#581c87']];
const adh=i=>{const a=ADS[i%5];return`<div class=adc style="background:linear-gradient(120deg,${a[3]})"><span>${a[0]}<br><small>${a[1]}</small></span><i>${a[2]}</i></div>`};
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let A=[],F=null,user=null,ed=null;
const ago=t=>{const h=(Date.now()-t)/36e5;return h<1?'Just now':h<24?(h|0)+'h ago':(h/24|0)+'d ago'};
const yt=u=>((u||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/)||[])[1],isV=u=>/\.(mp4|webm)(\?|$)/i.test(u||'');
const thumb=a=>{const y=yt(a.media);return y?`https://img.youtube.com/vi/${y}/hqdefault.jpg`:(!a.media||isV(a.media))?`https://picsum.photos/seed/${a.id}/800/450`:a.media};
const mh=a=>{const y=yt(a.media);return y?`<div class=vid><iframe src="https://www.youtube.com/embed/${y}" allowfullscreen></iframe></div>`:isV(a.media)?`<video controls src="${esc(a.media)}"></video>`:`<img src="${thumb(a)}" alt="">`};
const cats=()=>[...new Set([...CATS,...A.map(a=>a.cat)])];
const card=a=>`<a class=card href="#/a/${a.id}"><img loading=lazy src="${thumb(a)}" alt=""><div><span class=tag>${esc(a.cat)}</span><h3>${esc(a.title)}</h3><small>${esc(a.author)} · ${ago(a.ts)}</small></div></a>`;
// ---------- data layer ----------
async function load(){const s=await F.fs.getDocs(F.fs.collection(F.db,'news'));A=s.docs.map(d=>d.data())}
async function put(a){if(F){await F.fs.setDoc(F.fs.doc(F.db,'news',a.id),a);await load()}else{const i=A.findIndex(x=>x.id==a.id);i<0?A.unshift(a):A[i]=a;localStorage.dp_news=JSON.stringify(A)}}
async function rm(id){if(F){await F.fs.deleteDoc(F.fs.doc(F.db,'news',id));await load()}else{A=A.filter(x=>x.id!=id);localStorage.dp_news=JSON.stringify(A)}}
async function init(){
 if(FBC){try{const B='https://www.gstatic.com/firebasejs/10.12.0/',m=await import(B+'firebase-app.js'),fs=await import(B+'firebase-firestore.js'),au=await import(B+'firebase-auth.js'),app=m.initializeApp(FBC);
  F={db:fs.getFirestore(app),auth:au.getAuth(app),fs,au};au.onAuthStateChanged(F.auth,u=>{user=u;if(location.hash.includes('admin'))route()});await load()}catch(e){console.error(e);F=null;A=[]}}
 else{A=JSON.parse(localStorage.dp_news||'[]');user=localStorage.admin?{email:ADMIN_EMAIL}:null}
 route()}
// ---------- views ----------
function nav(){const h=decodeURIComponent(location.hash.slice(2).split('/')[1]||'');$('#nav').innerHTML=`<a href="#/" class="${location.hash.length<3?'on':''}">Home</a>`+cats().map(c=>`<a href="#/cat/${encodeURIComponent(c)}" class="${h==c?'on':''}">${esc(c)}</a>`).join('')}
function side(){const t=[...A].sort((a,b)=>b.ts-a.ts).slice(0,6);return`<aside><div class="ad sq">${adh(1)}</div><div class=side><h3>Trending</h3>${t.map((a,i)=>`<a href="#/a/${a.id}"><b style="color:var(--ac)">${i+1}.</b> ${esc(a.title)}</a>`).join('')}</div></aside>`}
function home(){const s=[...A].sort((a,b)=>b.ts-a.ts),h=s.find(a=>a.feat)||s[0];if(!h){$('#app').innerHTML=`<div class=wrap><section><h2 class=sec>Latest News</h2><p>No news has been published yet. Please check back soon.</p></section>${side()}</div>`;return}const r=s.filter(a=>a!=h);
 $('#app').innerHTML=`<a class=hero href="#/a/${h.id}"><img src="${thumb(h)}" alt=""><div><span class=tag>Breaking</span><h1>${esc(h.title)}</h1><small style="color:#ddd">${esc(h.author)} · ${ago(h.ts)}</small></div></a>
 <div class=wrap><section><h2 class=sec>Latest News</h2><div class=g>${r.slice(0,8).map(card).join('')}</div>${cats().map(c=>{const l=r.filter(a=>a.cat==c).slice(0,3);return l.length?`<h2 class=sec><a href="#/cat/${encodeURIComponent(c)}">${esc(c)} ›</a></h2><div class=g>${l.map(card).join('')}</div>`:''}).join('')}</section>${side()}</div>`}
function list(t,l){$('#app').innerHTML=`<div class=wrap><section><h2 class=sec>${esc(t)} (${l.length})</h2><div class=g>${l.sort((a,b)=>b.ts-a.ts).map(card).join('')||'<p>No results found.</p>'}</div></section>${side()}</div>`}
function art(id){const a=A.find(x=>x.id==id);if(!a){$('#app').innerHTML='<p>Not found.</p>';return}document.title=a.title+' | Daily Pulse';
 const AD=`<div class="ad ia">${adh(2)}</div>`,ps=a.body.split('</p>').filter(x=>x.trim()),body=ps.map((x,i)=>x+'</p>'+(i==0?mh(a):'')+(i==1?AD:'')).join('')+(ps.length<2?AD:'');
 $('#app').innerHTML=`<div class=wrap><article class=art><span class=tag>${esc(a.cat)}</span> <small>${esc(a.topic)}</small><h1>${esc(a.title)}</h1><small>By ${esc(a.author)} · ${new Date(a.ts).toLocaleDateString()} · ${ago(a.ts)}</small>${body}<small>Tags: ${esc(a.kw)}</small></article>${side()}</div>`}
function logout(){F?F.au.signOut(F.auth):(delete localStorage.admin,user=null);location.hash='#/';route()}
function admin(){
 if(!user){$('#app').innerHTML=`<form class=box id=lf style="max-width:400px"><h2>Admin Login</h2><input id=le type=email placeholder=Email required><input id=lp type=password placeholder=Password required><button>Login</button><p id=lerr class=err></p>${F?'':'<small>Demo mode (Firebase config not set): data is saved only in this browser.</small>'}</form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{if(F)await F.au.signInWithEmailAndPassword(F.auth,le.value,lp.value);else if(le.value==ADMIN_EMAIL){localStorage.admin=1;user={email:le.value};route()}else throw 0}catch(x){lerr.textContent='Login failed. Check email/password.'}};return}
 const e=A.find(a=>a.id==ed)||{},v=k=>`value="${esc(e[k]||'')}"`,B=[['B','bold'],['I','italic'],['H2','formatBlock','h2'],['P','formatBlock','p'],['• List','insertUnorderedList'],['Link','createLink']];
 $('#app').innerHTML=`<div class=box><div class=row><h2>${ed?'Edit':'Add'} News</h2><button onclick=logout()>Logout</button></div><form id=nf>
 <input id=fa placeholder="Author Name" required ${v('author')}><input id=ft placeholder="Headline / Title" required ${v('title')}>
 <input id=fc list=cl placeholder="Category (pick or type a new one)" required ${v('cat')}><datalist id=cl>${cats().map(c=>`<option>${c}`).join('')}</datalist>
 <input id=fs placeholder="Topic / Subject (موضوع)" ${v('topic')}><input id=fk placeholder="SEO Keywords & Tags (comma separated)" ${v('kw')}>
 <input id=fm placeholder="Featured Image / Video URL (YouTube, .mp4 or image)" ${v('media')}>
 <div class=tb>${B.map(b=>`<button type=button onmousedown="event.preventDefault();tb('${b[1]}','${b[2]||''}')">${b[0]}</button>`).join('')}</div><div id=fb class=ed contenteditable>${e.body||''}</div>
 <p><label><input type=checkbox id=ff ${e.feat?'checked':''}> Featured / Breaking</label></p><button>${ed?'Update':'Publish'}</button> ${ed?'<button type=button onclick="ed=null;route()">Cancel</button>':''}</form></div>
 <div class=box><h3>Manage News (${A.length})</h3><div style="overflow-x:auto"><table><tr><th>Title<th>Category<th>Featured<th>Actions</tr>${[...A].sort((a,b)=>b.ts-a.ts).map(a=>`<tr><td>${esc(a.title)}<td>${esc(a.cat)}<td><button onclick="tg('${a.id}')">${a.feat?'★ Yes':'☆ No'}</button><td><button onclick="ed='${a.id}';route();scrollTo(0,0)">Edit</button><button onclick="dl('${a.id}')">Delete</button></tr>`).join('')}</table></div></div>`;
 $('#nf').onsubmit=async x=>{x.preventDefault();try{await put({id:ed||Date.now().toString(36),author:fa.value,title:ft.value,cat:fc.value.trim(),topic:fs.value,kw:fk.value,media:fm.value.trim(),body:fb.innerHTML||'<p></p>',feat:ff.checked,ts:e.ts||Date.now()});ed=null;alert('Saved!');route()}catch(er){alert('Error: '+er.message)}}}
function tb(c,a){if(c=='createLink')a=prompt('URL?');if(c=='createLink'&&!a)return;document.execCommand(c,false,a||null)}
async function tg(id){const a=A.find(x=>x.id==id);try{await put({...a,feat:!a.feat});route()}catch(e){alert(e.message)}}
async function dl(id){if(confirm('Delete this article?')){try{await rm(id);route()}catch(e){alert(e.message)}}}
function route(){const h=location.hash.slice(2).split('/'),k=decodeURIComponent(h[1]||'');nav();document.title='Daily Pulse News';
 if(h[0]=='a')art(h[1]);else if(h[0]=='cat')list(k,A.filter(a=>a.cat==k));else if(h[0]=='q')list('Search: '+k,A.filter(a=>[a.title,a.kw,a.cat,a.topic,a.author].join(' ').toLowerCase().includes(k.toLowerCase())));else if(h[0]=='admin')admin();else home();if(h[0]!='admin')scrollTo(0,0)}
$('#q').oninput=e=>{const v=e.target.value.trim();if(v.toLowerCase()==ADMIN_EMAIL){e.target.value='';location.hash='#/admin';return}location.hash=v?'#/q/'+encodeURIComponent(v):'#/'};
const setT=t=>{document.documentElement.dataset.t=t;localStorage.theme=t};setT(localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#th').onclick=()=>setT(document.documentElement.dataset.t=='dark'?'light':'dark');
document.querySelectorAll('[data-ad]').forEach(e=>e.innerHTML=adh(+e.dataset.ad));localStorage.removeItem('news');addEventListener('hashchange',route);init();
</script></body></html>
